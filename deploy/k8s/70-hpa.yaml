apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n9e-alter-service
  namespace: n9e-alter-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n9e-alter-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
