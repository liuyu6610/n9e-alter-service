apiVersion: v1
kind: Secret
metadata:
  name: n9e-alter-service-secret
  namespace: n9e-alter-service
type: Opaque
stringData:
  # Global API auth (optional)
  API_TOKEN: ""

  # Push ingest auth (recommended if push.enabled=true)
  PUSH_TOKEN: ""

  # N9E auth (choose ONE of the following)
  N9E_USER_TOKEN: ""
  N9E_AUTHORIZATION: ""

  # Redis password (optional)
  STATE_REDIS_PASSWORD: ""

  # Redis addr (optional, if you prefer env override instead of config.json)
  STATE_REDIS_ADDR: ""
